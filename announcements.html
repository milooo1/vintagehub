<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Announcements — VintageHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .announcements-page { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
    .page-announcement-header { text-align: center; margin-bottom: 60px; }
    .page-announcement-header h1 {
      font-size: 48px; font-weight: 800; margin: 16px 0;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      -webkit-background-clip: text; background-clip: text; color: #ffffff;
    }
    .page-announcement-header p { color: #ffffff; font-size: 18px; }

    .announcements-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 32px; margin-bottom: 60px;
    }

    .announcement-card {
      background: white; border-radius: 24px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .announcement-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.12); }

    .announcement-image { width: 100%; height: 240px; overflow: hidden; background: #f0f0f0; position: relative; }
    .announcement-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .announcement-card:hover .announcement-image img { transform: scale(1.05); }

    .no-image {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-size: 48px;
    }

    .announcement-content { padding: 24px; }

    .announcement-badge {
      display: inline-block; padding: 4px 12px; background: #ff6b6b; color: white;
      font-size: 12px; font-weight: 600; border-radius: 20px; margin-bottom: 16px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .announcement-badge.event { background: #4ecdc4; }
    .announcement-badge.offer { background: #ff6b6b; }
    .announcement-badge.update { background: #45b7d1; }

    .announcement-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: #1a1a2e; line-height: 1.3; }
    .announcement-date { font-size: 13px; color: #999; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .announcement-date::before { content: "📅"; font-size: 12px; }
    .announcement-text { color: #555; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }

    /* Countdown timer */
    .announcement-timer {
      display: inline-block; background: #fff4e5; color: #b45309;
      font-size: 13px; padding: 6px 12px; border-radius: 20px; margin-bottom: 16px;
    }

    .announcement-links {
      display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
      padding-top: 12px; border-top: 1px solid #eee;
    }
    .announcement-link {
      display: inline-flex; align-items: center; gap: 6px; color: #4ecdc4;
      text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.3s;
    }
    .announcement-link:hover { color: #ff6b6b; }
    .announcement-link::before { content: "🔗"; font-size: 12px; }

    .whatsapp-more-btn {
      display: inline-flex; align-items: center; gap: 8px; background: #25D366; color: white;
      padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: 600;
      font-size: 14px; transition: all 0.3s ease; margin-top: 8px;
    }
    .whatsapp-more-btn:hover { background: #128C7E; transform: scale(1.02); }
    .whatsapp-more-btn::before { content: "💬"; font-size: 16px; }

    .whatsapp-float {
      position: fixed; bottom: 30px; right: 30px; background: #25D366; color: white;
      width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; text-decoration: none; font-size: 30px;
      box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4); transition: all 0.3s ease; z-index: 100;
    }
    .whatsapp-float:hover { transform: scale(1.1); background: #128C7E; }

    .no-announcements { grid-column: 1 / -1; text-align: center; padding: 80px 20px; background: white; border-radius: 24px; }
    .no-announcements h3 { font-size: 24px; color: #1a1a2e; margin-bottom: 12px; }
    .no-announcements p { color: #666; margin-bottom: 24px; }

    @media (max-width: 768px) {
      .announcements-grid { grid-template-columns: 1fr; gap: 24px; }
      .page-announcement-header h1 { font-size: 36px; }
      .announcement-title { font-size: 20px; }
      .whatsapp-float { width: 50px; height: 50px; font-size: 24px; bottom: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">VintageHub</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="booking.html">Book Us</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="announcements.html" class="active">Announcements</a></li>
    </ul>
  </nav>

  <div class="announcements-page">
    <div class="page-announcement-header">
      <p class="section-label">Stay Updated</p>
      <h1>Announcements & News</h1>
      <p>Latest updates, special offers, and important information</p>
    </div>

    <div class="announcements-grid" id="announcementsGrid"></div>
  </div>

  <footer>
    <p>© 2025 VintageHub Photography. All rights reserved.</p>
  </footer>

  <a href="https://wa.me/94772780118?text=Hi!%20I%20want%20to%20know%20more%20about%20your%20announcements"
     class="whatsapp-float" target="_blank">💬</a>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, query, where, orderBy, onSnapshot, Timestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const WA = "94772780118";
    const grid = document.getElementById("announcementsGrid");
    const labels = { event: "🎉 EVENT", offer: "🔥 OFFER", update: "📢 UPDATE" };
    let items = [];
    let tick = null;

    const safeUrl = u => /^https?:\/\//i.test(u) ? u : "#";

    function make(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function timeLeft(ms) {
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
            m = Math.floor(s % 3600 / 60), sec = s % 60;
      if (d > 0) return `${d}d ${h}h ${m}m`;
      if (h > 0) return `${h}h ${m}m ${sec}s`;
      return `${m}m ${sec}s`;
    }

    function card(a) {
      const c = make("div", "announcement-card");
      c.dataset.expires = a.expiresAt.toMillis();

      const imgWrap = make("div", "announcement-image");
      if (a.image) {
        const img = document.createElement("img");
        img.src = a.image; img.alt = a.title;
        imgWrap.appendChild(img);
      } else {
        const n = make("div", "no-image"); n.appendChild(make("span", "", "📢"));
        imgWrap.appendChild(n);
      }
      c.appendChild(imgWrap);

      const body = make("div", "announcement-content");
      body.appendChild(make("span", `announcement-badge ${a.badge}`, labels[a.badge] || labels.update));
      body.appendChild(make("h3", "announcement-title", a.title));
      body.appendChild(make("div", "announcement-date",
        a.createdAt ? a.createdAt.toDate().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) : ""));
      body.appendChild(make("p", "announcement-text", a.text));

      const timer = make("div", "announcement-timer");
      timer.append("⏳ Ends in ");
      timer.appendChild(make("strong", "countdown"));
      body.appendChild(timer);

      if (a.links && a.links.length) {
        const wrap = make("div", "announcement-links");
        a.links.forEach(l => {
          const link = make("a", "announcement-link", l.text);
          link.href = safeUrl(l.url); link.target = "_blank"; link.rel = "noopener";
          wrap.appendChild(link);
        });
        body.appendChild(wrap);
      }

      const wa = make("a", "whatsapp-more-btn", "More Info on WhatsApp");
      wa.href = `https://wa.me/${WA}?text=${encodeURIComponent("Hi! I want more info about: " + a.title)}`;
      wa.target = "_blank";
      body.appendChild(wa);

      c.appendChild(body);
      return c;
    }

    function emptyState() {
      const box = make("div", "no-announcements");
      box.appendChild(make("h3", "", "📢 No Announcements Right Now"));
      box.appendChild(make("p", "", "Check back soon for updates, offers, and news!"));
      const wa = make("a", "whatsapp-more-btn", "Get Updates on WhatsApp");
      wa.href = `https://wa.me/${WA}?text=${encodeURIComponent("Hi! I want to know more about updates")}`;
      wa.target = "_blank";
      box.appendChild(wa);
      return box;
    }

    function render() {
      grid.innerHTML = "";
      const now = Date.now();
      const live = items.filter(a => a.expiresAt && a.expiresAt.toMillis() > now);
      if (!live.length) { grid.appendChild(emptyState()); return; }
      live.forEach(a => grid.appendChild(card(a)));
      updateCountdowns();
    }

    function updateCountdowns() {
      const now = Date.now();
      let expired = false;
      grid.querySelectorAll(".announcement-card").forEach(c => {
        const left = Number(c.dataset.expires) - now;
        if (left <= 0) expired = true;
        else c.querySelector(".countdown").textContent = timeLeft(left);
      });
      if (expired) render(); // removes expired cards live, no refresh needed
    }

    const q = query(
      collection(db, "announcements"),
      where("expiresAt", ">", Timestamp.now()),
      orderBy("expiresAt")
    );

    onSnapshot(q, snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
      render();
      if (!tick) tick = setInterval(updateCountdowns, 1000);
    }, err => {
      console.error(err);
      grid.innerHTML = "";
      grid.appendChild(emptyState());
    });
  </script>
</body>
</html>
